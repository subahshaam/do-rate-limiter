global
  log stdout format raw local0

defaults
  log global
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend rate_limiter
  bind :8080
  default_backend app_replicas

backend app_replicas
  balance roundrobin
  option httpchk GET /actuator/health/readiness
  http-check expect status 200
  server app1 app1:8080 check
  server app2 app2:8080 check
